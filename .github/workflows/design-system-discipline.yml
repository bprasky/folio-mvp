name: Design System Discipline

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tailwind.config.js'
      - '.github/workflows/design-system-discipline.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tailwind.config.js'
      - '.github/workflows/design-system-discipline.yml'
  workflow_dispatch:

jobs:
  accent-discipline:
    name: Accent color discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid burgundy accent regression
        run: |
          if git grep -nE "#7[Cc]1[Ee]3[Dd]" src/ tailwind.config.js; then
            echo "::error::Burgundy accent #7C1E3D is forbidden. Use var(--folio-gold)."
            exit 1
          fi

      - name: Forbid hardcoded gold accents
        run: |
          # Email templates and PDF generators are exempt: CSS vars don't resolve in
          # mail clients or pdfkit. SVG gradient strings in AttributionFlowChart are
          # multi-stop literals that can't carry a single var().
          MATCHES=$(git grep -nEi "#c9a96e|#b8845c" src/ \
            | grep -v "src/lib/email/" \
            | grep -v "src/lib/boost/inContextBoost" \
            | grep -v "src/components/vendor/charts/AttributionFlowChart.tsx" \
            | grep -v "src/app/api/products/\[productId\]/spec-sheet/route.ts" \
            | grep -v "src/app/globals.css:.*--folio-gold:" \
            | grep -v "src/app/globals.css:.*--folio-gold-ornament:" \
            | grep -v "src/components/ui/folio-design-system.ts:.*\*" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Hardcoded gold hex found outside the canonical token. Use var(--folio-gold) or var(--folio-gold-ornament)."
            echo "$MATCHES"
            exit 1
          fi

      - name: Forbid hardcoded canvas colors
        run: |
          # Email templates, in-context-boost emails, the pdfkit spec-sheet, and the
          # qrcode generator (FolioBadgeModal) are exempt: CSS vars don't resolve in
          # mail clients, PDF rendering contexts, or qrcode color options.
          # /product/* warm wash is deliberate (see Task 06 — product page rework).
          BAD=$(git grep -nEi "#[Ff][Aa][Ff]9[Ff]7|#[Ff]4[Ff]2[Ff]0|#[Ff][Aa][Ff]8[Ff]5" src/ \
            | grep -v "src/lib/email/" \
            | grep -v "src/lib/boost/inContextBoost" \
            | grep -v "src/lib/messaging/notifications.ts" \
            | grep -v "src/components/badge/FolioBadgeModal.tsx" \
            | grep -v "src/app/api/products/\[productId\]/spec-sheet/" \
            | grep -v "src/components/product/" \
            | grep -v "src/app/globals.css:.*--surface-" \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::Hardcoded canvas hex found. Use var(--surface-canvas), var(--surface-ground), or var(--surface-elevated)."
            echo "$BAD"
            exit 1
          fi

      - name: Forbid deprecated bg aliases
        run: |
          if git grep -nE "var\(--bg-base\)|var\(--bg-elevated\)" src/; then
            echo "::error::--bg-base and --bg-elevated were removed in Task 02. Use --surface-canvas / --surface-ground."
            exit 1
          fi

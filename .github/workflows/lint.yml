name: Lint

# The ratchet. Errors block; warnings do not.
#
# The repo carries ~3400 accumulated warnings, almost all no-explicit-any and
# no-unused-vars. Blocking on those would mean nothing merges, so they stay
# visible and non-blocking. What DOES block is every rule the codebase is
# currently clean on — react-hooks/rules-of-hooks above all, which was at 17
# violations until they were fixed and is now enforced at zero.
#
# The point is not to make old code clean. It is that a rule at zero stays at
# zero, so new code cannot reintroduce a class of bug that has just been paid
# down. Demote a rule here only with a reason; never to make a red build green.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.eslintrc.json'
      - '.eslintignore'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - 'tsconfig*'
      - 'next.config.*'
      - 'prisma/**'
      - 'tools/typescript-baseline.json'
      - 'tools/typescript-display-equivalences.json'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.eslintrc.json'
      - '.eslintignore'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - 'tsconfig*'
      - 'next.config.*'
      - 'prisma/**'
      - 'tools/typescript-baseline.json'
      - 'tools/typescript-display-equivalences.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  mobile-editorial:
    name: Mobile editorial layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check responsive components
        run: LOADING_TEST_BROWSER="$(command -v google-chrome || command -v chromium)" node scripts/check-mobile-editorial.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-editorial-screenshots
          path: .tmp/mobile-editorial/*.png
  core:
    name: Core regression journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:core
      - name: Organization appearance, permissions and public profile
        run: npx tsx --test scripts/core/org-profile-appearance-data.test.cjs scripts/core/org-profile-appearance-routes.test.cjs
      - run: npm run test:rollout
      - name: Production-mode public and protected image delivery
        run: node scripts/check-image-delivery.cjs
      - name: Project draft persistence and listing privacy
        run: |
          npx tsx --test scripts/core/project-draft.test.cjs
          node --experimental-vm-modules scripts/check-project-list-privacy.cjs
          GUIDED_TEST_BROWSER="$(command -v google-chrome || command -v chromium)" node scripts/check-project-draft-browser.cjs
      - run: npm run test:interruptions
      - name: Signup and durable workspace import
        run: |
          node scripts/check-signup-verification.cjs
          node scripts/check-workspace-import.cjs
          node scripts/check-professional-entry.cjs
          node scripts/check-professional-routing.cjs
      - name: Guided interview regression checks
        run: npm run test:guided
      - name: Live and guided browser regression checks
        run: |
          export GUIDED_TEST_BROWSER="$(command -v google-chrome || command -v chromium)"
          node scripts/check-live-interview-browser.cjs
          node scripts/check-project-guide-browser.cjs
          npm run test:interruptions:browser
          node scripts/check-project-setup-browser.cjs
          node scripts/check-rollout-recovery-browser.cjs
          node scripts/check-manual-rooms-browser.cjs
          RESPONSIVE_QUICK=1 RESPONSIVE_BROWSER="$GUIDED_TEST_BROWSER" node scripts/check-responsive-journey.cjs
          node scripts/check-project-completion-date.cjs
          LOADING_TEST_BROWSER="$GUIDED_TEST_BROWSER" node scripts/check-editorial-loading.cjs
          npm run test:guided:browser
      - name: Live interview and playable media regression checks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          node scripts/check-live-interviews.cjs
          node scripts/check-live-cleanup.cjs
          node scripts/check-live-adapters.cjs
          npm run test:project-guide
          node scripts/check-live-csp.cjs
          node scripts/check-media-rollout.cjs
          npm run test:live:media
          npm run test:live:journey
      - name: Firm enrollment and posting permissions
        run: |
          node scripts/check-firm-enrollment.cjs
          node scripts/check-professional-entry.cjs
          node scripts/check-professional-routing.cjs
          node scripts/check-professional-auth-aliases.cjs
          node scripts/check-auth-oauth.cjs
          node scripts/check-org-join-notifications.cjs
          npx tsx --test scripts/core/firm-posting-policy.test.cjs
      - name: Publishing Studio regression checks
        run: |
          node scripts/check-publishing-studio-data.cjs
          node scripts/check-studio-landing.cjs
          node scripts/check-studio-pitches.cjs
          node scripts/check-studio-opportunities.cjs
          node scripts/check-expertise-engine.cjs
          node scripts/check-expertise-ui.cjs
          node scripts/check-expertise-navigation.cjs
          node scripts/check-expertise-persistence.cjs
          node scripts/check-expertise-postgres.cjs
          node scripts/check-release-plans.cjs
          node scripts/check-release-plan-persistence.cjs
          node scripts/check-studio-release-ui.cjs
          node scripts/check-studio-draft-removal.cjs
          node scripts/check-studio-briefs.cjs
          node scripts/check-studio-recommendations.cjs
          node scripts/check-readiness-engine.cjs
          node scripts/check-readiness-service.cjs
          node scripts/check-readiness-sources.cjs
          node scripts/check-readiness-ui.cjs
          node scripts/check-candidate-configurator.cjs
          node scripts/check-campaign-readiness.cjs
          node scripts/check-editorial-queue-readiness.cjs
          node scripts/check-carousel-editor.cjs
          node scripts/check-carousel-persistence.cjs
          node scripts/check-carousel-page.cjs
          node --import tsx scripts/check-immersive-rooms.ts
          node --import tsx scripts/check-publication-presentation.ts
          node --import tsx scripts/check-publication-social.ts
          node scripts/check-social-generation.cjs
          node scripts/check-social-generation-route.cjs
          node scripts/check-story-activities.cjs
          node scripts/check-story-activity-ui.cjs
          node scripts/check-studio-activity-entry.cjs
          node scripts/check-activity-social-card.cjs
          node scripts/check-studio-bio-publication.cjs
          node scripts/check-story-creation.cjs
          node scripts/check-story-http.cjs
          node scripts/check-story-persistence.cjs
          node scripts/check-activity-questions.cjs

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint — errors fail, warnings are reported
        run: npx eslint . --ext .ts,.tsx,.js,.jsx


  typescript:
    name: TypeScript diagnostic ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test the diagnostic guard
        run: npm run typecheck:test
      - name: Render folder routes with their provider
        run: node scripts/check-folder-prerender.cjs
      # Next 14 compile mode emits real route types without prerendering or DB access.
      - name: Generate Prisma and Next route types
        run: npm run typecheck:prepare
      - name: Reject new diagnostics and baseline expansion
        env:
          # Full-project compiler analysis exceeds Node's default 2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
          TYPESCRIPT_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: npm run typecheck


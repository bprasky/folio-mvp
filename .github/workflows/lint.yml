name: Lint

# The ratchet. Errors block; warnings do not.
#
# The repo carries ~3400 accumulated warnings, almost all no-explicit-any and
# no-unused-vars. Blocking on those would mean nothing merges, so they stay
# visible and non-blocking. What DOES block is every rule the codebase is
# currently clean on — react-hooks/rules-of-hooks above all, which was at 17
# violations until they were fixed and is now enforced at zero.
#
# The point is not to make old code clean. It is that a rule at zero stays at
# zero, so new code cannot reintroduce a class of bug that has just been paid
# down. Demote a rule here only with a reason; never to make a red build green.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.eslintrc.json'
      - '.eslintignore'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - 'tsconfig*'
      - 'next.config.*'
      - 'prisma/**'
      - 'tools/typescript-baseline.json'
      - 'tools/typescript-display-equivalences.json'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.eslintrc.json'
      - '.eslintignore'
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - 'tsconfig*'
      - 'next.config.*'
      - 'prisma/**'
      - 'tools/typescript-baseline.json'
      - 'tools/typescript-display-equivalences.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  core:
    name: Core regression journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:core

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint — errors fail, warnings are reported
        run: npx eslint . --ext .ts,.tsx,.js,.jsx


  typescript:
    name: TypeScript diagnostic ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test the diagnostic guard
        run: npm run typecheck:test
      # Next 14 compile mode emits real route types without prerendering or DB access.
      - name: Generate Prisma and Next route types
        run: npm run typecheck:prepare
      - name: Reject new diagnostics and baseline expansion
        env:
          TYPESCRIPT_BUDGET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: npm run typecheck

name: Pull Quote Verbatim

# docs/17 Section 5 makes verbatim the editorial standard: a pull quote is the
# contributor's actual words. `scripts/check-pull-quotes.ts` is the only thing in
# the repo that enforces it mechanically rather than by prompt instruction, and
# until now it ran in no workflow — it was a package.json script nobody had to
# invoke.
#
# What it pins is an ORDERING and a set of absences, both of which a well-meaning
# refactor breaks silently:
#
#   - pull quotes are assigned AFTER fixSentenceOpeners and applyProseNamingGate,
#     because both rewrite body paragraphs and a quote captured before them stops
#     matching the text it came from;
#   - a chapter with no verified selection is CLEARED, not skipped, so an
#     unverified quote from an earlier run cannot survive;
#   - the picker PATCHes only text already present in `alternatives`, and there is
#     exactly one picker.
#
# None of that is expressible as a type. It fails as a wrong string under a real
# designer's name on a published page — "elements on tension" shipping as
# "elements in tension" is the regression this exists for — which is found in the
# pipeline or not at all.

on:
  pull_request:
    paths:
      - 'src/lib/posting/**'
      - 'src/components/story/**'
      - 'src/app/api/posting/**'
      - 'scripts/check-pull-quotes.ts'
      - '.github/workflows/pull-quote-verbatim.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/posting/**'
      - 'src/components/story/**'
      - 'src/app/api/posting/**'
      - 'scripts/check-pull-quotes.ts'
      - '.github/workflows/pull-quote-verbatim.yml'
  workflow_dispatch:

jobs:
  verbatim:
    name: Pull quotes are selected, never written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The check imports src/lib/posting/selectPullQuotes.ts, which reaches
      # @prisma/client through the blocks schema. Types are erased at runtime, but
      # the module must resolve.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check pull-quote contract
        run: npx tsx scripts/check-pull-quotes.ts
